services:
  # MySQL 8.0 Primary Database
  db:
    image: mysql:8.0
    container_name: exam_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ExamRootSecret2026!
      MYSQL_DATABASE: online_exam_db
      MYSQL_USER: exam_user
      MYSQL_PASSWORD: ExamSecurePassword2026!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pExamRootSecret2026!"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - exam_network

  # Redis In-Memory Cache & Background Job Queue
  redis:
    image: redis:7-alpine
    container_name: exam_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - exam_network

  # Node.js + Express + Socket.IO Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exam_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost
      DB_DIALECT: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: exam_user
      DB_PASSWORD: ExamSecurePassword2026!
      DB_NAME: online_exam_db
      DB_POOL_MAX: 25
      DB_POOL_MIN: 5
      DB_POOL_ACQUIRE: 30000
      DB_POOL_IDLE: 10000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super_secret_jwt_key_exam_management_system_2026_production
      JWT_EXPIRES_IN: 7d
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 1000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - exam_network

  # React 19 Frontend served via Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exam_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - exam_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  exam_network:
    driver: bridge
